services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 2s
      timeout: 3s
      retries: 20

  collector:
    build: ./collector
    environment:
      IRIS_DATABASE_URL: postgresql://iris:iris@postgres:5432/iris
    ports:
      - "4318:4318"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - collector

volumes:
  iris_pgdata:
