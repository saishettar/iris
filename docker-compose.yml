services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data

  collector:
    build: ./collector
    environment:
      IRIS_DATABASE_URL: postgresql://iris:iris@postgres:5432/iris
    ports:
      - "4318:4318"
    depends_on:
      - postgres

volumes:
  iris_pgdata:
