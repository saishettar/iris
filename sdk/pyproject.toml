[project]
name = "iris-otel"
version = "0.0.1"
description = "OpenTelemetry-native instrumentation SDK for LLM/agent calls (Iris)"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
