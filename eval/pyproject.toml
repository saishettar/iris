[project]
name = "iris-eval"
version = "0.0.1"
description = "YAML-driven eval/regression runner for LLM call paths, in the shape of promptfoo's config and assertion vocabulary"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.69",
]

[project.scripts]
iris-eval = "iris_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
